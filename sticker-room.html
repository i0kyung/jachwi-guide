<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FFFBF5" />
<title>스티커 방 · 자취 가이드</title>
<link rel="icon" type="image/png" href="assets/brand/app-icon-64.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="css/app.css" />
<style>
  .room-head{display:flex;align-items:center;gap:14px;margin-top:6px;padding:18px;border-radius:var(--radius-l);
    background:linear-gradient(140deg,#FFF6E0,#FFE9CF);box-shadow:0 14px 30px rgba(240,180,120,.22);position:relative;overflow:hidden;}
  .room-head img{width:96px;flex:none;}
  .room-head h1{font-size:1.35rem;font-weight:950;letter-spacing:-.03em;}
  .room-head p{font-size:.86rem;font-weight:800;color:#9a7a62;margin-top:3px;}
  .room-head .progress-track{margin-top:10px;}
  .room-head::after{content:"";position:absolute;top:0;bottom:0;width:35%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 4s ease-in-out 1s infinite;}

  .celebrate{display:none;margin-top:16px;text-align:center;padding:20px;border-radius:var(--radius-l);background:var(--white);
    border:2px solid var(--lime);box-shadow:var(--soft-shadow);}
  .celebrate.show{display:block;animation:popIn .6s var(--ease-pop);}
  .celebrate img{width:120px;animation:wiggle 1s ease-in-out infinite;}
  .celebrate h2{font-size:1.15rem;font-weight:950;margin-top:6px;}
  .celebrate p{font-size:.86rem;font-weight:750;color:var(--muted);margin-top:4px;}

  .sticker-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px;}
  .sticker{position:relative;background:var(--white);border:1px solid rgba(221,229,194,.7);border-radius:var(--radius-m);
    padding:16px 10px 14px;text-align:center;box-shadow:var(--soft-shadow);cursor:pointer;overflow:hidden;
    transition:transform .25s var(--ease-pop),box-shadow .25s;}
  .sticker .art{height:118px;display:flex;align-items:center;justify-content:center;}
  .sticker .art img{max-height:118px;max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(58,58,58,.14));
    transition:transform .35s var(--ease-pop);}
  .sticker .name{display:block;font-size:.95rem;font-weight:950;margin-top:8px;}
  .sticker .date{display:block;font-size:.72rem;font-weight:850;color:var(--olive);margin-top:4px;}
  .sticker.owned::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:shine 3.6s ease-in-out infinite;}
  .sticker.owned:nth-child(2)::after{animation-delay:.6s;}.sticker.owned:nth-child(3)::after{animation-delay:1.2s;}
  .sticker.owned:nth-child(4)::after{animation-delay:1.8s;}.sticker.owned:nth-child(5)::after{animation-delay:2.4s;}
  .sticker.locked{background:#F6F4EC;}
  .sticker.locked .art img{filter:grayscale(1) brightness(1.15);opacity:.35;}
  .sticker.locked .date{color:#aaa;}
  .lock{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:#E6E3D6;display:grid;place-items:center;font-size:.75rem;}
  @media(hover:hover){.sticker.owned:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 18px 30px rgba(122,143,59,.2);}
    .sticker.owned:hover .art img{transform:scale(1.1) rotate(4deg);}}
  .sticker.flip{animation:flip .6s var(--ease-pop);}
  @keyframes flip{0%{transform:rotateY(0);}50%{transform:rotateY(90deg) scale(.95);}100%{transform:rotateY(0);}}
  .sticker.locked.nope{animation:shakeX .4s ease;}
</style>
</head>
<body>
  <div class="app" id="app">
    <header class="appbar">
      <button type="button" class="icon-btn" id="back-btn" aria-label="홈으로"></button>
      <div class="appbar-title"><small>자취 가이드</small><strong>내 스티커 방</strong></div>
    </header>
    <main class="app-main">
      <section class="room-head rise">
        <img src="assets/characters/idle.png" id="character-img" class="idle-float" alt="루온" />
        <div style="flex:1;min-width:0">
          <h1 id="room-title">스티커를 모아보세요</h1>
          <p id="subtitle">0 / 5개 모았어요</p>
          <div class="progress-track"><div class="progress-fill" id="room-fill"></div></div>
        </div>
      </section>
      <div class="celebrate" id="celebrate">
        <img src="assets/stickers/sticker-medal.png" alt="" />
        <h2 id="celebrate-title">대단해요!</h2>
        <p>이제 자취 생활이 조금 더 든든해졌어요.</p>
      </div>
      <div class="sticker-grid" id="sticker-grid"></div>
    </main>
  </div>
<script src="js/app.js"></script>
<script>
spawnLeaves(document.getElementById('app'),5);
renderTabbar('sticker');
const back=document.getElementById('back-btn');back.innerHTML=ICONS.back;
back.addEventListener('click',()=>goWithLoading('index.html'));

const PRAISE=['대단해요! 생활관리왕!','완벽해요! 자취 고수가 되었어요!','멋져요! 이제 못 할 게 없어요!'];
const IMG=document.getElementById('character-img');
IMG.addEventListener('error',()=>IMG.src='assets/characters/idle.png');
const stickers=getJSON(LS.stickers,[]);
const dates=getJSON(LS.dates,{});
const nick=getNick()||'자취러';
const owned=FIELDS.filter(f=>stickers.includes(f.id)).length;
document.getElementById('room-title').textContent=nick+'님의 스티커';
document.getElementById('subtitle').textContent=owned+' / '+FIELDS.length+'개 모았어요';
setTimeout(()=>{document.getElementById('room-fill').style.width=Math.max(6,owned/FIELDS.length*100)+'%';},400);

const grid=document.getElementById('sticker-grid');
FIELDS.forEach((f,i)=>{
  const has=stickers.includes(f.id);
  const div=document.createElement('div');
  div.className='sticker rise '+(has?'owned':'locked');
  div.style.animationDelay=(.15+i*.08)+'s';
  div.innerHTML='<span class="art"><img src="'+f.sticker+'" alt="'+f.name+' 스티커"></span><span class="name">'+f.name+'</span>'+
    (has?'<span class="date">획득 '+(dates[f.id]||'-')+'</span>':'<span class="date">아직 잠겨 있어요</span><span class="lock">🔒</span>');
  div.addEventListener('click',()=>{
    if(has){div.classList.remove('flip');void div.offsetWidth;div.classList.add('flip');toast(f.name+' 스티커 · '+(dates[f.id]||'-')+' 획득');}
    else{div.classList.remove('nope');void div.offsetWidth;div.classList.add('nope');toast(f.name+' 퀴즈를 통과하면 받을 수 있어요');}
  });
  grid.appendChild(div);
});
/* 6번째 칸: 5개를 다 모으면 받는 마스터 메달 */
const master=owned===FIELDS.length;
const m=document.createElement('div');
m.className='sticker rise '+(master?'owned':'locked');m.style.animationDelay=(.15+5*.08)+'s';
m.innerHTML='<span class="art"><img src="'+STICKER_EXTRA.medal+'" alt="자취 마스터 메달"></span><span class="name">자취 마스터</span>'+
  (master?'<span class="date">5개 분야 모두 완료!</span>':'<span class="date">5개를 모으면 열려요</span><span class="lock">🔒</span>');
m.addEventListener('click',()=>{m.classList.remove(master?'flip':'nope');void m.offsetWidth;m.classList.add(master?'flip':'nope');
  toast(master?'자취 마스터 메달을 받았어요!':'남은 '+(FIELDS.length-owned)+'개 분야를 완료해 보세요');});
grid.appendChild(m);
if(master){
  IMG.src='assets/characters/happy.png';
  document.getElementById('celebrate-title').textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  document.getElementById('celebrate').classList.add('show');
  launchConfetti();
}
</script>
</body>
</html>
