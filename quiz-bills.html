<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FFFBF5" />
<title>공과금 퀴즈 · 자취력 키우기</title>
<link rel="icon" type="image/png" href="assets/brand/app-icon-64.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/quiz.css" />
</head>
<body>
  <div class="app no-tabbar" id="app">
    <header class="appbar">
      <button type="button" class="icon-btn" id="back-btn" aria-label="홈으로"></button>
      <div class="appbar-title"><small>자취력 키우기</small><strong id="field-name"></strong></div>
      <span class="progress" id="progress">1 / 5</span>
    </header>
    <div class="segments" id="segments"></div>
    <main class="app-main">
      <div class="char-wrap">
        <img id="character-img" class="character-img fade-up" src="assets/characters/bill_pose 01.png" alt="루온" />
        <div class="bubble" id="bubble">참 잘했어요!</div>
      </div>
      <section class="quiz-card" id="quiz-card">
        <span class="scene-tag" id="scene-tag">상황</span>
        <h1 class="scene-title" id="scene-title"></h1>
        <p class="scene-text" id="scene-text"></p>
        <div class="choices" id="choices"></div>
        <div class="explain" id="explain">
          <span class="explain-head" id="explain-head">정답 해설</span>
          <span class="explain-text" id="explain-text"></span>
          <span class="source" id="source"></span>
        </div>
        <button type="button" class="btn btn-lime next-btn" id="next-btn">다음 문제 <span class="chev">›</span></button>
      </section>
    </main>
    <div class="combo" id="combo"><img src="assets/stickers/sticker-streak.png" alt="" /><strong>2연속 정답!</strong></div>
    <div class="sticker-pop" id="sticker-pop"><div class="sticker-card"></div></div>
  </div>


<script src="js/app.js"></script>
